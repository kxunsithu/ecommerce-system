<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - ShopEase</title>
  <link rel="stylesheet" href="../dist/output.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
  <div id="navbar"></div>
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-gray-100 p-8">
      <h1 class="text-2xl font-bold mb-2 text-center">Create Account</h1>
      <p class="text-gray-500 text-center mb-6">Join ShopEase today</p>
      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Full Name *</label>
          <input id="reg-name" type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Email *</label>
          <input id="reg-email" type="email" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Username *</label>
          <input id="reg-username" type="text" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Phone Number *</label>
          <input id="reg-phone" type="tel" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password * (min 6 chars)</label>
          <input id="reg-password" type="password" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Confirm Password *</label>
          <input id="reg-confirm" type="password" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition">Register</button>
      </form>
      <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="./login.html" class="text-blue-600 hover:underline">Login</a></p>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module" src="../src/js/main.js"></script>
  <script type="module" src="../src/js/register.js"></script>
</body>
</html>
