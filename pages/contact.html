<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - ShopEase</title>
  <link rel="stylesheet" href="../dist/output.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
  <div id="navbar"></div>
  <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    <h1 class="text-3xl font-bold mb-6">Contact Us</h1>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <h2 class="text-lg font-bold mb-4">Get in Touch</h2>
        <ul class="space-y-3 text-gray-600">
          <li class="flex items-center gap-3"><i data-lucide="mail" class="w-5 h-5 text-blue-600"></i> support@shopease.com</li>
          <li class="flex items-center gap-3"><i data-lucide="phone" class="w-5 h-5 text-blue-600"></i> +1 (555) 123-4567</li>
          <li class="flex items-center gap-3"><i data-lucide="map-pin" class="w-5 h-5 text-blue-600"></i> 123 Market St, City</li>
        </ul>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <h2 class="text-lg font-bold mb-4">Send a Message</h2>
        <form id="contact-form" class="space-y-4">
          <input id="c-name" type="text" placeholder="Your Name" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
          <input id="c-email" type="email" placeholder="Your Email" class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
          <textarea id="c-message" rows="4" placeholder="Your Message" class="w-full px-4 py-2 border border-gray-200 rounded-lg"></textarea>
          <button type="submit" class="w-full bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition">Send</button>
        </form>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module" src="../src/js/main.js"></script>
  <script type="module" src="../src/js/contact.js"></script>
</body>
</html>
