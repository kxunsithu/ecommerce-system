<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - ShopEase</title>
  <link rel="stylesheet" href="../dist/output.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
  <div id="navbar"></div>
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <h1 class="text-2xl font-bold mb-6">Products</h1>

    <!-- Filters -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6 flex flex-col md:flex-row gap-4">
      <div class="flex-1">
        <input id="search-input" type="text" placeholder="Search products..." class="w-full px-4 py-2 border border-gray-200 rounded-lg" />
      </div>
      <select id="category-filter" class="px-4 py-2 border border-gray-200 rounded-lg">
        <option value="">All Categories</option>
      </select>
      <select id="sort-filter" class="px-4 py-2 border border-gray-200 rounded-lg">
        <option value="">Sort by</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating-desc">Rating: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
      </select>
    </div>

    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>
  <div id="footer"></div>

  <script type="module" src="../src/js/main.js"></script>
  <script type="module" src="../src/js/products.js"></script>
</body>
</html>
