<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ShopEase</title>
  <link rel="stylesheet" href="../dist/output.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('shopease_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">
  <div id="navbar"></div>
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-8">
      <h1 class="text-2xl font-bold mb-2 text-center">Welcome Back</h1>
      <p class="text-gray-500 dark:text-gray-400 text-center mb-6">Login to your account</p>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email or Username</label>
          <input id="login-id" type="text" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg" placeholder="you@example.com" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input id="login-password" type="password" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg" placeholder="••••••••" />
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2"><input id="remember-me" type="checkbox" class="accent-blue-600" /> Remember me</label>
          <button type="button" id="forgot-pw" class="text-blue-600 dark:text-blue-400 hover:underline">Forgot password?</button>
        </div>
        <button type="submit" class="w-full bg-blue-600 dark:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-800 transition">Login</button>
      </form>
      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">Don't have an account? <a href="./register.html" class="text-blue-600 dark:text-blue-400 hover:underline">Register</a></p>
    </div>
  </main>
  <div id="footer"></div>

  <script type="module" src="../src/js/main.js"></script>
  <script type="module" src="../src/js/login.js"></script>
</body>
</html>
